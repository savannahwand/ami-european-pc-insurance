# AMI Signal Dictionary v0.7 (multilingual, expanded)
# Adds German compound-form stopgap terms (hochautomatisiert, automatisierungsgrad,
# etc.) and 'Dunkelverarbeitung(squote)' (dark processing / STP rate), a German
# insurance term for zero-touch automated processing, found in Neodigital's 2024
# annual report. NOTE: standalone 'automatisierung'/'automatisiert' were already in
# v0.6 and are NOT re-added here -- their failure to match in the Neodigital rerun
# points to a pipeline/matcher issue, not a dictionary gap. Compound coverage here is
# a stopgap; the durable fix is suffix-based regex in the matcher, same approach
# already used for the 'leiter' compound issue in the seniority dictionary.
